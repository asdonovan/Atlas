spring.application.name=atlas
spring.datasource.url=jdbc:postgresql://localhost:5432/atlas
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate checks to see where entity mapping is compatible with existing schema
spring.jpa.hibernate.ddl-auto=validate

# DB_USERNAME and PASSWORD is stored in environment variables. Can view if you search
# "edit system enviornment variables" in windows search
